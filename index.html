<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6ef">
  <meta name="description" content="上传头像，输入名字，生成 Duo 展开与合起两张原尺寸截图。免费开源，图片仅在本机处理。">
  <title>Duo截图生成器</title>
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./js/app.mjs"></script>
</head>
<body>
  <header class="header">
    <a class="brand" href="./" aria-label="Duo截图生成器首页"><img src="./assets/icon.svg" alt="" width="38" height="38"><span>Duo<span class="brand-rest">截图生成器</span></span></a>
    <a class="github-link" href="https://github.com/Bingee/duo-screenshot" target="_blank" rel="noopener noreferrer" aria-label="查看 GitHub 开源代码"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 19c-4.5 1.4-4.5-2.5-6-3m12 6v-3.9a3.4 3.4 0 0 0-.9-2.7c3-.3 6.2-1.5 6.2-6.9a5.4 5.4 0 0 0-1.5-3.8A5 5 0 0 0 18.7 1S17.5.6 15 2.5a13 13 0 0 0-7 0C5.5.6 4.3 1 4.3 1a5 5 0 0 0-.1 3.7 5.4 5.4 0 0 0-1.5 3.8c0 5.4 3.2 6.6 6.2 6.9a3.4 3.4 0 0 0-.9 2.7V22"/></svg><span>GitHub</span><span class="arrow">↗</span></a>
  </header>
  <main class="workspace">
    <section class="editor" aria-labelledby="editor-title">
      <div class="editor-intro"><span class="eyebrow">DUO / SCREENSHOT</span><h1 id="editor-title">换成你的。</h1><p>一个名字，两种形态。</p></div>
      <div class="profile-fields">
        <div class="field-label"><span>头像</span><button id="reset" class="text-button" type="button">重置</button></div>
        <label class="avatar-picker" id="drop-zone" for="avatar-input">
          <span class="avatar-circle"><img id="avatar-preview" alt="已选头像" hidden><svg id="avatar-placeholder" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="17" r="8"/><path d="M9 42v-4a15 15 0 0 1 30 0v4"/></svg></span>
          <span><strong id="avatar-label">选择头像</strong><span class="upload-note">也可以拖一张图片到这里</span></span>
          <svg class="upload-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V3m-5 5 5-5 5 5M4 15v5h16v-5"/></svg>
        </label>
        <input id="avatar-input" class="visually-hidden" type="file" accept="image/*" aria-label="选择头像">
        <label class="field-label name-label" for="name-input">名字</label>
        <input id="name-input" type="text" placeholder="输入你的名字" maxlength="80" autocomplete="off" spellcheck="false" enterkeyhint="done">
        <div class="time-row"><span>系统时间 <b id="clock">--:--</b></span><button id="reroll" class="text-button" type="button" aria-label="重新随机系统时间"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M5.5 8a7 7 0 0 1 11.6-3L20 8M4 16l2.9 3A7 7 0 0 0 18.5 16"/></svg>换个时间</button></div>
      </div>
      <div class="save-area">
        <button id="save-button" class="primary-button" type="button" disabled><span>保存两张截图</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg></button>
        <p class="privacy-note"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="2"/><path d="M5 7V5a3 3 0 0 1 6 0v2"/></svg>图片仅在本机处理，免费保存</p>
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <div id="download-options" class="download-options" hidden>
          <p id="download-help">也可以分别保存 PNG</p>
          <div class="download-links"><a id="download-open" download="Duo-open.png">内屏 PNG ↓</a><a id="download-closed" download="Duo-closed.png">外屏 PNG ↓</a></div>
        </div>
      </div>
    </section>
    <section class="preview-section" aria-labelledby="preview-title" aria-busy="true">
      <div class="preview-heading"><h2 id="preview-title">效果预览</h2><span id="render-state" class="render-state">正在准备底图</span></div>
      <div class="view-switcher" role="tablist" aria-label="选择预览形态"><button id="tab-open" role="tab" aria-selected="true" aria-controls="panel-open" tabindex="0" data-mode="open">展开内屏</button><button id="tab-closed" role="tab" aria-selected="false" aria-controls="panel-closed" tabindex="-1" data-mode="closed">合起外屏</button></div>
      <div class="screens" data-mode="open">
        <figure id="panel-open" class="screen screen-open" aria-labelledby="tab-open"><div class="screen-surface"><img id="preview-open" width="2853" height="2007" alt="Duo 展开内屏截图预览" draggable="false"></div><figcaption><span>展开内屏</span><span>2853 × 2007</span></figcaption></figure>
        <figure id="panel-closed" class="screen screen-closed" aria-labelledby="tab-closed"><div class="screen-surface"><img id="preview-closed" width="1398" height="2034" alt="Duo 合起外屏截图预览" draggable="false"></div><figcaption><span>合起外屏</span><span>1398 × 2034</span></figcaption></figure>
      </div>
      <p class="preview-note">保留底图原始尺寸，预览会随编辑更新。</p>
    </section>
  </main>
  <footer class="footer"><span>Duo截图生成器</span><span>本地生成 · 开源</span><a href="./SOURCES.md">素材说明 ↗</a></footer>
  <noscript>请启用 JavaScript 后使用截图生成器。所有图片处理均在你的浏览器中完成。</noscript>
</body>
</html>
